[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "mgdstars"
description = "A Python package for Minimal Geometric Deformation (MGD) star calculations"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Mariannly Marquez", email = "mariannly.marquez@yachaytech.edu.ec"},
]
keywords = ["physics", "general-relativity", "modified-gravity", "stars", "neutron-stars", "MGD"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "sympy>=1.8.0",
]
dynamic = ["version"]

[project.optional-dependencies]
viz = ["matplotlib>=3.0", "seaborn>=0.11"]
dev = [
    "pytest>=6.0", 
    "black>=21.0", 
    "flake8>=3.9", 
    "mypy>=0.910", 
    "pre-commit>=2.15",
    "pytest-cov>=2.12"
]
docs = [
    "sphinx>=4.0", 
    "sphinx-rtd-theme>=1.0", 
    "myst-parser>=0.15",
    "nbsphinx>=0.8"
]
jupyter = [
    "jupyter>=1.0",
    "notebook>=6.0",
    "ipywidgets>=7.6"
]

[project.urls]
Homepage = "https://github.com/mariannly/mgdstars"
Documentation = "https://mgdstars.readthedocs.io"
Repository = "https://github.com/mariannly/mgdstars.git"
Issues = "https://github.com/mariannly/mgdstars/issues"

[project.scripts]
mgdstars = "mgdstars.cli:main"

[tool.setuptools]
packages = ["mgdstars"]

[tool.setuptools.dynamic]
version = {attr = "mgdstars.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=mgdstars",
    "--cov-report=term-missing",
    "--cov-report=html",
]

[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "scipy.*",
    "sympy.*",
    "matplotlib.*",
    "seaborn.*"
]
ignore_missing_imports = true